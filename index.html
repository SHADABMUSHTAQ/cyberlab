<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="CyberLab — learn networking by inspecting, building, configuring, and troubleshooting a virtual physical lab." />
<title>CyberLab — Learn networking by doing</title>
<link rel="icon" href="/assets/logo.svg" />
<link rel="stylesheet" href="/styles-base.css" />
<link rel="stylesheet" href="/styles-lab.css" />
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <button class="brand" data-action="home" aria-label="CyberLab home">
      <img src="/assets/logo.svg" alt="" class="brand-mark" />
      <span><strong>Cyber</strong><em>Lab</em></span>
      <small>beta</small>
    </button>
    <nav class="topnav" aria-label="Primary navigation">
      <button class="nav-item active" data-nav="home">Home</button>
      <button class="nav-item" data-nav="learn">Learning paths</button>
      <button class="nav-item" data-nav="playground">Playground</button>
      <button class="nav-item" data-nav="achievements">Achievements</button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" aria-label="Search" data-action="search">⌕</button>
      <button class="xp-pill"><span class="spark">✦</span><b id="xpValue">0</b> XP</button>
      <button class="profile-chip" data-action="profile"><span class="avatar">G</span><span><b>Guest</b><small id="levelLabel">Sign in to sync progress</small></span></button>
    </div>
  </header>

  <main id="mainView" class="page-shell" aria-live="polite"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
