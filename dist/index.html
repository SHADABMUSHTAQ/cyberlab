function checkStep(){const s=lab.steps?.[stepIndex];if(!s)return;let ok=false,byType=t=>sim.devices.filter(d=>d.type===t);if(s.kind==='inspect')ok=byType(s.target).some(d=>has('inspect',d.id));if(s.kind==='inspectPort'){const [t,p]=s.target.split(':');ok=byType(t).some(d=>has('inspectPort',`${d.id}:${p}`))||inspectorTab==='ports'&&selectedDevice&&sim.getDevice(selectedDevice).type===t}if(s.kind==='cableTool')ok=has('cableTool',s.target);if(s.kind==='connect'){const [left,right]=s.target.split('>'),[lt,lp]=left.split(':'),[rt,rp]=right.split(':');ok=sim.links.some(l=>{const A=sim.getDevice(l.a.split(':')[0]),B=sim.getDevice(l.b.split(':')[0]);return A&&B&&((A.type===lt&&l.a.endsWith(':'+lp)&&B.type===rt&&l.b.endsWith(':'+rp))||(B.type===lt&&l.b.endsWith(':'+lp)&&A.type===rt&&l.a.endsWith(':'+rp)))})}if(s.kind==='terminal')ok=has('terminal',s.target);if(s.kind==='configIp')ok=byType(s.target).some(d=>sim.getIp(d.id).ip!=='Not configured');if(s.kind==='ping')ok=has('ping',s.target);if(!ok)return toast('Not yet. Do the action in the lab first — Byte is checking the real lab state.');stepIndex++;if(stepIndex>=lab.steps.length){completeLab(lab.id,actions);return achievement()}renderCoach();highlightCurrentTarget();toast('Nice — next step unlocked.')}
function verifyPractice(){let ok=false;if(lab.id==='physical-1')ok=['switch','router','firewall'].every(t=>sim.devices.filter(d=>d.type===t).some(d=>has('inspect',d.id)));if(lab.id==='cabling-1'){const pc=sim.devices.find(d=>d.type==='pc'),sw=sim.devices.find(d=>d.type==='switch');ok=!!(pc&&sw&&sim.links.some(l=>(l.a===pc.id+':eth0'&&l.b===sw.id+':gi0/1')||(l.b===pc.id+':eth0'&&l.a===sw.id+':gi0/1'))&&has('terminal','pc'))}if(lab.id==='ipv4-1'){const pc=sim.devices.find(d=>d.type==='pc'),srv=sim.devices.find(d=>d.type==='server');ok=!!(pc&&srv&&sim.getIp(pc.id).ip==='192.168.10.10'&&sim.getIp(srv.id).ip==='192.168.10.20'&&has('ping','192.168.10.20'))}if(!['physical-1','cabling-1','ipv4-1'].includes(lab.id))return toast('This advanced lab is visible for curriculum preview, but its full verification engine is still being expanded.');if(!ok)return toast('Not verified yet. Inspect the network and prove the objective without Guided mode.');masterLab(lab.id,actions);achievement(true)}
function achievement(mastery=false){const root=modalRoot();root.innerHTML=`<div class="modal-backdrop"><div class="modal-card achievement"><div class="trophy">🏆</div><span class="kicker"><i class="kicker-dot"></i> ${mastery?'Independent mastery':'Guided lab complete'}</span><h2>${lab.title}</h2><p>${mastery?'You solved the lab without step-by-step help. That counts as mastery.':'You learned the workflow. Replay it in Practice mode to prove you can do it independently.'}</p><div class="reward-row"><div class="reward"><b>+${mastery?250:150}</b><small>XP</small></div><div class="reward"><b>${state.completed.length}</b><small>labs complete</small></div><div class="reward"><b>${rank()[1]}</b><small>rank</small></div></div><div style="display:flex;gap:8px"><button class="btn secondary" data-home style="flex:1">Back home</button>${mastery?'':'<button class="btn primary" data-practice style="flex:1">Practice it</button>'}</div></div></div>`;root.querySelector('[data-home]').onclick=()=>{root.innerHTML='';homeHandler()};root.querySelector('[data-practice]')?.addEventListener('click',()=>{root.innerHTML='';mode='practice';stepIndex=0;sim.reset();actions.length=0;setupDevices();renderLab()})}
function showOrientation(){const root=modalRoot();root.innerHTML=`<div class="modal-backdrop"><div class="modal-card"><div class="orientation-art">${lab.icon}</div><span class="kicker"><i class="kicker-dot"></i> Before you begin</span><h2>${lab.title}</h2><p>${lab.subtitle}</p><div class="orientation-list"><div class="orientation-item"><span>①</span><span><b>Look first.</b> Click devices to learn what they are and inspect their ports.</span></div><div class="orientation-item"><span>②</span><span><b>Do the physical work.</b> Pick up cables and connect the exact interfaces yourself.</span></div><div class="orientation-item"><span>③</span><span><b>Use commands when needed.</b> The terminal stays secondary until the network is physically ready.</span></div></div><button class="btn primary" data-start style="width:100%">Enter the physical lab →</button></div></div>`;root.querySelector('[data-start]').onclick=()=>{markOrientation(lab.id);root.innerHTML='';highlightCurrentTarget()}}
function highlightCurrentTarget(){$$('.lab-device').forEach(x=>x.classList.remove('focused'));$$('.port').forEach(x=>x.classList.remove('target'));if(mode!=='guided')return;const s=lab.steps?.[stepIndex];if(!s)return;if(['inspect','terminal','configIp'].includes(s.kind)){const d=sim.devices.find(d=>d.type===s.target);if(d)document.querySelector(`[data-device="${d.id}"]`)?.classList.add('focused')}if(s.kind==='inspectPort'){const [t,p]=s.target.split(':'),d=sim.devices.find(d=>d.type===t);if(d){document.querySelector(`[data-device="${d.id}"]`)?.classList.add('focused');highlightPort(d.id,p)}}if(s.kind==='cableTool')document.querySelector(`[data-cable="${s.target}"]`)?.classList.add('active')}
function bindLabActions(){$('[data-action="leave"]').onclick=homeHandler;$$('[data-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.mode==='practice'&&!state.completed.includes(lab.id)&&lab.id!=='sandbox')return toast('Complete Guided mode once before independent practice.');mode=b.dataset.mode;stepIndex=0;sim.reset();actions.length=0;setupDevices();panels=null;renderLab()});$('[data-action="resetLab"]').onclick=()=>{sim.reset();actions.length=0;stepIndex=0;selectedDevice=null;setupDevices();panels=null;renderLab();toast('Lab reset to its starting state.')};$('[data-action="helpLab"]').onclick=showOrientation;$$('[data-cable]').forEach(b=>b.onclick=()=>chooseCable(b.dataset.cable));$$('[data-action="terminal"]').forEach(b=>b.onclick=()=>toggleTerminal());$$('[data-add-device]').forEach(b=>b.onclick=()=>{const t=b.dataset.addDevice;sim.addDevice(t,220+Math.random()*380,250+Math.random()*170);renderStage();toast(`${DEVICE_CATALOG[t].name} added to the bench.`)})}

return { setHomeHandler, startLab };
})();
const __app=(()=>{
const { renderHome, renderLearn, renderAchievements, setStartLabHandler }=__home;
const { startLab, setHomeHandler }=__lab;
const { updateTopStats, setProgressSyncHandler, applyCloudProgress, state }=__state;
const { initCloud, loadCloudProgress, persistCompletion, isSignedIn }=__cloud;
const { paintProfile, showAccount, setAuthRerender }=__auth_ui;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const toast=$('#toast');window.cyberToast=msg=>{toast.textContent=msg;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),3000)};
setStartLabHandler(startLab);setHomeHandler(renderHome);setAuthRerender(()=>{if(state.activeTab==='learn')renderLearn();else if(state.activeTab==='achievements')renderAchievements();else renderHome()});
setProgressSyncHandler(async payload=>{if(!isSignedIn())return;try{const r=await persistCompletion(payload);if(r?.streak){state.streak=r.streak}const progress=await loadCloudProgress();applyCloudProgress(progress);paintProfile();window.cyberToast?.('Progress synced to your account.')}catch(e){console.error(e);window.cyberToast?.('Lab saved locally; cloud sync will retry after sign-in.')}});
$$('.nav-item').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='home')renderHome();if(b.dataset.nav==='learn')renderLearn();if(b.dataset.nav==='playground')startLab('sandbox');if(b.dataset.nav==='achievements')renderAchievements()});
$('[data-action="home"]').onclick=renderHome;$('[data-action="profile"]').onclick=showAccount;
async function boot(){
  $('#mainView').innerHTML='<section class="boot-screen"><div class="boot-logo"><img src="/assets/logo.svg" alt=""><b>CyberLab</b></div><div class="boot-spinner"></div><p>Preparing your networking bench…</p></section>';
  await initCloud();
  if(isSignedIn())try{const progress=await loadCloudProgress();applyCloudProgress(progress)}catch(e){console.warn('Cloud progress unavailable',e);window.cyberToast?.('Signed in, but cloud progress could not load. Using local progress for now.')}
  paintProfile();renderHome();updateTopStats();
}
boot();

return {  };
})();
</script>
